# AsBuild, the TRUSTED half. Copy this file to .github/workflows/ in your repository.
# It runs from your main branch when asbuild-test finishes. It never checks out or runs pull-request code:
# it reads the test results as data, takes the commit from the workflow_run event, fetches AsBuild's code from
# hevelius-ai/asbuild, and posts one check run named "AsBuild" and one receipt on the pull request.
# AsBuild uses no repository secrets.

name: asbuild-verdict

on:
  workflow_run:
    workflows: [asbuild-test]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: write
  issues: write
  pull-requests: write

# One verdict at a time per commit, so a re-run cannot post a second receipt. A run for an older commit finds no
# pull request whose head it is and posts nothing, so it can never overwrite the newer receipt or cancel its run.
concurrency:
  group: asbuild-verdict-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  verdict:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash # with -e and -o pipefail: a failed command in a pipe fails the step
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      MAIN: ${{ github.event.repository.default_branch }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (main, never the pull request)
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Find the pull request whose head is this commit
        id: pr
        run: |
          gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
            | jq --arg repo "$REPO" --arg sha "$HEAD_SHA" --arg main "$MAIN" \
              '[.[] | select(.head.repo.full_name == $repo and .head.sha == $sha and .base.ref == $main
                              and .state == "open")][0]' > pr.json
          if [ "$(cat pr.json)" = "null" ]; then
            echo "No open pull request into $MAIN has $HEAD_SHA as its head: nothing to judge."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "number=$(jq -r .number pr.json)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.pr.outputs.number != ''
        with:
          python-version: "3.12"

      - name: Fetch AsBuild (from hevelius-ai/asbuild, never from this repository)
        if: steps.pr.outputs.number != ''
        run: |
          git clone --quiet --depth 1 --branch main https://github.com/hevelius-ai/asbuild "$RUNNER_TEMP/asbuild"
          echo "ASBUILD=$RUNNER_TEMP/asbuild" >> "$GITHUB_ENV"
          python -m pip install --quiet defusedxml==0.7.1

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        if: steps.pr.outputs.number != ''
        continue-on-error: true # no results is a verdict too: UNRESOLVED
        with:
          name: asbuild-evidence
          path: evidence/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Compute the verdict
        if: steps.pr.outputs.number != ''
        env:
          RECEIPT: out/receipt.md
        run: |
          python "$ASBUILD/engine/verdict.py" --evidence evidence/ --head "$HEAD_SHA" \
            --pr "${{ steps.pr.outputs.number }}" --main . \
            --out out/verdict.json --summary out/summary.md --receipt "$RECEIPT"

      - name: Post the check run
        if: always() && steps.pr.outputs.skip != 'true'
        run: |
          mkdir -p out
          if [ ! -s out/verdict.json ]; then
            echo '{"verdict": "UNRESOLVED"}' > out/verdict.json
            echo "AsBuild could not compute the verdict. Nothing is claimed. Verdict run: $RUN_URL" > out/summary.md
          fi
          verdict=$(jq -r .verdict out/verdict.json)
          case "$verdict" in
            PROVEN) c=success ;;
            "WAITING FOR YOU") c=action_required ;;
            *) c=failure ;;
          esac
          jq -n --arg sha "$HEAD_SHA" --arg c "$c" --arg url "$RUN_URL" --arg title "AsBuild: $verdict" \
                --rawfile summary out/summary.md \
            '{name: "AsBuild", head_sha: $sha, status: "completed", conclusion: $c, details_url: $url,
              output: {title: $title, summary: $summary}}' \
            | gh api -X POST "repos/$REPO/check-runs" --input - > /dev/null

      - name: Post the receipt (one comment, edited in place)
        if: always() && steps.pr.outputs.number != ''
        run: |
          n="${{ steps.pr.outputs.number }}"
          if [ ! -s out/receipt.md ]; then
            printf '%s\n%s\n\n%s\n\n```\n%s\n```\n%s\n' '<!-- asbuild-receipt -->' \
              "Stop. Don't accept it. AsBuild couldn't finish its check, so nothing was checked." \
              '<details><summary>Technical report</summary>' "AsBuild: UNRESOLVED. Verdict run: $RUN_URL" \
              '</details>' > out/receipt.md
          fi
          id=$(gh api "repos/$REPO/issues/$n/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- asbuild-receipt -->"))) | .id' \
            | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@out/receipt.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$n/comments" -F body=@out/receipt.md > /dev/null
          fi
